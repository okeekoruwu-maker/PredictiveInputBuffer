name: Build Android64 Geode mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PredictiveInputBuffer-Android64
          path: build-android64/*.geode
          if-no-files-found: error
